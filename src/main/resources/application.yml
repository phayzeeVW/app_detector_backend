app:
  home: ${user.home}/application_detector
  logs: ${app.home}/logs
spring:
  application:
    name: game_detector
  data:
    jdbc:
      dialect: mysql
  datasource:
    username: root
    password: root
    url: jdbc:mysql://localhost:3306/game_detector
    name: game_detector
  quartz:
    auto-startup: false
logging:
  file:
    name: "${app.logs}/application.log"
  logback:
    rollingpolicy:
      max-history: 90
      file-name-pattern: ${app.logs}/%d{yyyy-MM-dd}.%i.${logging.file.name}
      max-file-size: 10MB
  level:
    root: info
server:
  port: 8081
